name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*" # bare semver, incl. pre-release (e.g. 7.0.0-beta.0)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 7.0.0-beta.0)"
        required: true
      npm_mode:
        description: "npmjs mode: auto (stage; the only mode OIDC permits) or direct (needs a token - see the publish step)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - direct

permissions:
  contents: read # tag validation; the GitHub Release is created by release-announce.yml
  packages: write # publish to GitHub Packages
  id-token: write # mint OIDC tokens for npmjs trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Trusted publishing requires a GitHub-hosted runner; self-hosted is not supported.
    runs-on: ubuntu-latest
    # Must match the Environment field of every package's trusted publisher on npmjs.
    # The OIDC token only carries an `environment` claim when the job asks for one, so
    # dropping this silently breaks npmjs auth for the whole release.
    environment: production
    # Without this the GitHub default of 6h applies, so a stalled step burns
    # hours of runner time before anyone notices.
    timeout-minutes: 30
    env:
      # Dependency order, leaves first. Shared by both publish steps so they cannot
      # drift apart. Keep in sync with release-announce.yml.
      PACKAGES: "graphql-types utilize ormize gqlize ormize-adapter-sequelize ormize-adapter-valkey ormize-zod4 nestize"
      # The valkey suite talks to the service container below instead of
      # downloading a redis-server binary at test time. Keep the image pinned to
      # the same 7.x line as `redis-memory-server.version` in the root manifest.
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing version $VERSION"

      - name: Ensure the tag is on the production branch (main)
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the production branch (main); refusing to publish."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@azerothian"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set package versions to ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const pkg of fs.readdirSync("packages")) {
              const file = `packages/${pkg}/package.json`;
              if (!fs.existsSync(file)) continue;
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              // Internal ranges written as plain semver (e.g. peerDependencies: "^6.0.0")
              // do not travel with the release and would demand siblings from the previous
              // major. workspace: ranges are left alone - prepare-package.ts resolves those
              // against these just-bumped manifests.
              for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
                const deps = json[field];
                if (!deps) continue;
                for (const name of Object.keys(deps)) {
                  if (!name.startsWith("@azerothian/")) continue;
                  if (String(deps[name]).startsWith("workspace:")) continue;
                  deps[name] = `^${version}`;
                  console.log(`  ${json.name} ${field}.${name} -> ^${version}`);
                }
              }
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
              console.log(`${json.name} -> ${version}`);
            }
          ' "${{ steps.version.outputs.version }}"

      - name: Build
        run: pnpm build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          REGISTRY: https://npm.pkg.github.com
        run: |
          set -e
          for pkg in $PACKAGES; do
            name="@azerothian/${pkg}"
            # Idempotent: a re-run after a later step failed must not 409 here and
            # force the release onto a fresh version number.
            if npm view "${name}@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published; skipping"
              continue
            fi
            echo "Publishing ${name}@${VERSION} (tag: ${NPM_TAG})"
            pnpm publish "packages/${pkg}/publish" \
              --no-git-checks --access public --tag "${NPM_TAG}"
          done

      # --- npmjs.org ----------------------------------------------------------
      # Re-running setup-node rewrites ~/.npmrc to point at npmjs. Safe here because
      # the GitHub Packages publish above has already completed.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@azerothian"

      - name: Pin npm CLI (>= 11.15.0 for `npm stage`)
        run: |
          npm i -g npm@^11.15.0
          npm --version

      - name: Clear the placeholder auth token so npm falls through to OIDC
        run: |
          set -e
          # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into
          # $NPM_CONFIG_USERCONFIG and, when no token is supplied, exports NODE_AUTH_TOKEN
          # at job scope as the literal string XXXXX-XXXXX-XXXXX-XXXXX. npm treats any
          # configured credential as an explicit opt out of trusted publishing, so it sent
          # the placeholder and got E401 without ever minting an OIDC token. Removing the
          # line (rather than the env var, which is exported job-wide and out of reach of a
          # step-level `env:`) leaves the scope -> npmjs registry mapping intact.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "Remaining npmjs config keys:"
          sed 's/=.*//' "$NPM_CONFIG_USERCONFIG"

      - name: Drop the GitHub Packages registry override from the build artifacts
        run: |
          set -e
          # The source manifests keep publishConfig.registry pointing at GitHub Packages;
          # these publish/ directories are generated artifacts, so stripping it here
          # overrides the registry for npmjs without touching anything tracked in git.
          node -e '
            const fs = require("fs");
            for (const pkg of process.argv.slice(1)) {
              const file = `packages/${pkg}/publish/package.json`;
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              if (json.publishConfig) {
                delete json.publishConfig.registry;
                if (Object.keys(json.publishConfig).length === 0) delete json.publishConfig;
              }
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
              console.log(`stripped publishConfig.registry from ${file}`);
            }
          ' $PACKAGES

      - name: Publish to npmjs
        # Authenticates via OIDC trusted publishing - no token. Every package needs its own
        # trusted publisher registered on npmjs against Azerothian/gqlize + release.yml +
        # the production environment; there is no way to set one from CI. A package missing
        # one fails as a 404 "OIDC token exchange error - package not found" from the token
        # exchange, followed by a bare ENEEDAUTH from the publish itself.
        # Do not reintroduce NODE_AUTH_TOKEN: a token present here
        # wins over OIDC and forfeits the automatic provenance attestation. Likewise do not
        # rename this file, or add --provenance (it is implied under OIDC).
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          NPM_MODE: ${{ github.event.inputs.npm_mode || 'auto' }}
          REGISTRY: https://registry.npmjs.org
          # npm's OIDC helper is written never to throw: every reason it declines to
          # mint a token is logged at verbose and the publish then fails with a bare
          # ENEEDAUTH. Without this the only symptom of a trusted-publisher misconfig
          # is "need auth", with no indication of which claim did not match.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -e
          staged=""
          published=""
          for pkg in $PACKAGES; do
            name="@azerothian/${pkg}"
            # The trusted publishers allow `npm stage publish` only, so the direct branch
            # below cannot succeed over OIDC. It is reachable in two cases, both of which
            # need a human: npm_mode=direct, and a package added to the monorepo later
            # (neither staging nor trusted publishing can bootstrap a name that has never
            # been published - npm/cli#8544). Bootstrap those locally with
            # scripts/bootstrap-npmjs.sh, then register their trusted publisher.
            if [ "$NPM_MODE" = "auto" ] && npm view "$name" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "Staging ${name}@${VERSION} (tag: ${NPM_TAG})"
              ( cd "packages/${pkg}/publish" && npm stage publish --registry="$REGISTRY" --access public --tag "$NPM_TAG" )
              staged="${staged} ${name}"
            else
              echo "Publishing ${name}@${VERSION} directly (tag: ${NPM_TAG})"
              ( cd "packages/${pkg}/publish" && npm publish --registry="$REGISTRY" --access public --tag "$NPM_TAG" )
              published="${published} ${name}"
            fi
          done

          {
            echo "## npmjs - ${VERSION} (tag: \`${NPM_TAG}\`)"
            echo
            if [ -n "$published" ]; then
              echo "### Published immediately"
              for n in $published; do echo "- \`${n}\`"; done
              echo
            fi
            if [ -n "$staged" ]; then
              echo "### Staged - awaiting approval"
              for n in $staged; do echo "- \`${n}\`"; done
              echo
              echo 'Approve from a trusted device: `npm stage list`, then `npm stage approve <stage-id>` for each (prompts for an OTP).'
              echo
            fi
            echo "Then run the **Release Announce** workflow with tag \`${VERSION}\` to create the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
