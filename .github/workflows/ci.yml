name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Without this the GitHub default of 6h applies, so a stalled step burns
    # hours of runner time before anyone notices.
    timeout-minutes: 20
    env:
      # The valkey suite talks to the service container below instead of
      # downloading a redis-server binary at test time. Keep the image pinned to
      # the same 7.x line as `redis-memory-server.version` in the root manifest.
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Installs pnpm (version read from `packageManager` in package.json) and
      # Node in one step. `install: false` keeps the explicit --frozen-lockfile
      # install below, so a stale lockfile fails the build instead of being
      # quietly reconciled.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Covers src (tsc -b), every __tests__ tree, and the strict
      # definition-typesystem assertions in ormize-adapter-sequelize.
      - name: Typecheck
        run: pnpm typecheck

      # After Typecheck: the type-aware rules need a program that compiles, and a
      # type error here reads as a confusing lint failure rather than as itself.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Schema drift, and the DB-free-generation gate in one. Each example's
      # `orm()` never connects (see its `src/orm.ts`), and this job has no SQL
      # service — so a change that reintroduces a connection on the schema-build
      # path fails here, as does an edit to the models that nobody rebuilt
      # `generated/` for.
      #
      # Both examples, because the two adapters reach the offline path from
      # opposite directions: the SQL one skips replaying a definition's raw DDL,
      # while the MikroORM one derives its definitions from metadata that was
      # never behind a connection in the first place.
      - name: Schema drift
        run: pnpm --filter @azerothian/example-gqlize-basic schema:check

      - name: Schema drift (mikro-orm)
        run: pnpm --filter @azerothian/example-mikro-orm-basic schema:check
