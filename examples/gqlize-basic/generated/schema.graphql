schema {
  query: RootQuery
  mutation: Mutation
}

type RootQuery {
  """Fetches an object given its ID"""
  node(
    """The ID of an object"""
    id: ID!
  ): Node
  models: QueryModels
}

"""An object with an ID"""
interface Node {
  """The id of the object."""
  id: ID!
}

type QueryModels {
  Item(
    """If provided it will return results after the provided cursor"""
    after: String

    """
    If provided the results will be the first ${amount} of records from provided cursor, if a cursor is not provided the results will be the first ${amount} of records.
    """
    first: Int

    """If provided it will return results before the provided cursor"""
    before: String

    """
    If provided the results will be the first ${amount} of records from provided cursor, if a cursor is not provided  the results will be the last ${amount} of records.
    """
    last: Int

    """
    When true and this is a nested relationship, the relation is eager-loaded as an INNER JOIN so parents without a matching related row are excluded.
    """
    required: Boolean

    """
    If provided this will sort the results by the supplied column and direction
    """
    orderBy: [ItemOrderBy]
    where: GQLTQueryItemWhere
    include: [GQLTItemIncludeObject]
  ): ItemList
  Task(
    """If provided it will return results after the provided cursor"""
    after: String

    """
    If provided the results will be the first ${amount} of records from provided cursor, if a cursor is not provided the results will be the first ${amount} of records.
    """
    first: Int

    """If provided it will return results before the provided cursor"""
    before: String

    """
    If provided the results will be the first ${amount} of records from provided cursor, if a cursor is not provided  the results will be the last ${amount} of records.
    """
    last: Int

    """
    When true and this is a nested relationship, the relation is eager-loaded as an INNER JOIN so parents without a matching related row are excluded.
    """
    required: Boolean

    """
    If provided this will sort the results by the supplied column and direction
    """
    orderBy: [TaskOrderBy]
    where: GQLTQueryTaskWhere
    include: [GQLTTaskIncludeObject]
  ): TaskList
}

type ItemList {
  """Pager object for cursor based operations"""
  pageInfo: PageInfo!

  """Total amount of records available"""
  total: Int

  """List of edges for Item"""
  edges: [ItemEdge!]!

  """
  This page of Item rows as CSV text: a header line of column names, then one line per row. Ids are the same global ids the rows carry, `\N` is NULL, and the file can be uploaded back through `updateCsv`.
  """
  csv(
    """
    Which of Item's columns to write, in this order. Default: every column the caller may read.
    """
    columns: [String!]

    """The field separator, one character. Default `,`."""
    delimiter: String

    """Whether to write the header line. Default `true`."""
    header: Boolean
  ): String!
}

