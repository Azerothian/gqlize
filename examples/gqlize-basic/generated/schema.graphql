type GQLTCsvImportResult {
  """One entry per file, in the order given"""
  files: [GQLTCsvImportFileResult!]!

  """Each `@ref` label and the id of the row it labelled"""
  refs: GQLTJson!
}

"""What one file of a CSV import wrote"""
type GQLTCsvImportFileResult {
  """The file's name, as given or defaulted"""
  name: String!
  model: String!
  operation: GQLTCsvImportOperation!

  """Rows written"""
  count: Int!

  """The written rows' ids, in file order"""
  ids: [ID!]!
}

"""What one file of a CSV import does to its rows"""
enum GQLTCsvImportOperation {
  """Create one row per line"""
  create

  """Update the rows each line's key columns match"""
  update
}

"""The `JSON` scalar type represents raw JSON as values."""
scalar GQLTJson

"""One file of a `csvImport`"""
input CsvImportFile {
  model: CsvImportModel!
  operation: GQLTCsvImportOperation!
  file: GQLTUpload!

  """
  How errors and results name this file. Default: `<model>.<operation>`, numbered if repeated
  """
  name: String

  """
  The columns an `update` row is matched on, beside any `where.…` columns. Default: the primary key
  """
  keys: [String!]

  """The field separator. Default: a comma"""
  delimiter: String

  """
  Instance-method transforms to run on each row, as the model field's own `apply` argument takes them. Checked against that argument's type, so only the transforms it offers are accepted
  """
  apply: GQLTJson
}

"""A model that takes CSV rows in a `csvImport`"""
enum CsvImportModel {
  Item
  Task
}