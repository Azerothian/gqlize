type Mutation {
  models: MutationModels

  """
  Create or update rows of several models from CSV files in one all-or-nothing unit. A file's `@ref` column labels its rows; a `<relationship>.@ref` or `<foreignKey>.@ref` column in any file points at them
  """
  csvImport(files: [CsvImportFile!]!): GQLTCsvImportResult!
}

type MutationModels {
  Item(
    """This will create a new element for Item"""
    create: [ItemRequiredInput]

    """This will update a new element for Item"""
    update: [ItemUpdateInput]

    """
    This will find elements for Item and run relationship mutations on them without modifying the elements themselves
    """
    select: [ItemSelectInput]

    """This will delete a new element for Item"""
    delete: [GQLTQueryItemWhere]

    """
    A CSV file of Item rows to create, one per line, with field names as the header
    """
    createCsv: GQLTUpload

    """
    A CSV file of Item rows to update, matched on the `csv.keys` columns (default: the primary key)
    """
    updateCsv: GQLTUpload

    """
    A CSV file of Item rows to delete, holding only the `csv.keys` columns (default: the primary key)
    """
    deleteCsv: GQLTUpload

    """How the CSV uploads are read"""
    csv: GQLTCsvOptions
  ): [Item]
  Task(
    """This will create a new element for Task"""
    create: [TaskRequiredInput]

    """This will update a new element for Task"""
    update: [TaskUpdateInput]

    """
    This will find elements for Task and run relationship mutations on them without modifying the elements themselves
    """
    select: [TaskSelectInput]

    """This will delete a new element for Task"""
    delete: [GQLTQueryTaskWhere]

    """
    A CSV file of Task rows to create, one per line, with field names as the header
    """
    createCsv: GQLTUpload

    """
    A CSV file of Task rows to update, matched on the `csv.keys` columns (default: the primary key)
    """
    updateCsv: GQLTUpload

    """
    A CSV file of Task rows to delete, holding only the `csv.keys` columns (default: the primary key)
    """
    deleteCsv: GQLTUpload

    """How the CSV uploads are read"""
    csv: GQLTCsvOptions
  ): [Task]
}

